id: eval

invalid:
  - |
    #{ eval("1+1") }
  - |
    #std.eval("1+1")
  - "#let f = eval"
  - "#let f = std.eval"
  - |
    #let f = eval("x")
  - |
    #let f = std.eval("x")
  - |
    #expressions.map(
      eval.with(scope: (cell: table.cell) + scope),
    )

valid:
  - "`eval`"
  - eval
  - |
    #import "@preview/physica:0.9.5": evaluated
    #evaluated
  - "#let eval = evaluated"
  - "#eval"
