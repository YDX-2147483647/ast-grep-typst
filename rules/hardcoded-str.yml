docs: |
  = What it does
  Checks for uses of hardcoded strings.

  = Why is this bad?
  Hardcoded strings can be hard to maintain. In addition, user-facing strings would be untranslatable if hardcoded.

  = Example
  ```typst
  #let is-equation(x) = "equation" in repr(x)
  #is-equation($x$)
  ```

  Use instead:
  ```typst
  #let is-equation(x) = x.func() == math.equation
  #is-equation($x$)
  ```

  = Known problems
  This rule has so many false positives that it is off by default.

id: hardcoded-str
language: typst
severity: "off" # Low severity because too common
rule:
  kind: string
  regex: >-
    ^"(?:[^\n\\]|\\["nrt\\]|\\u\{[0-9a-f]+\}){3,}"$
  # At least three characters
  # https://typst.app/docs/reference/foundations/str/#escapes
  not:
    any:
      - inside:
          kind: import
          field: import
      - inside:
          kind: set
          stopBy: end
      - inside:
          # `assert`, `panic`, etc.
          kind: call
          stopBy: end
          any:
            - has:
                nthChild: 1
                field: item
                kind: ident
                regex: "^(?:panic|assert|regex|plugin|read)$"
            - has:
                # `assert.eq` and `assert.ne`
                nthChild: 1
                field: item
                kind: field
                has:
                  nthChild: 1
                  kind: ident
                  regex: "^assert$"
      - inside:
          # `args.has("children")`
          kind: call
          stopBy: end
          has:
            nthChild: 1
            kind: field
            field: item
            has:
              nthChild: 2
              kind: ident
              field: field
              regex: "^(?:at|has)$"
