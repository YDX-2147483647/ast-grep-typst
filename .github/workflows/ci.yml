name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # For downloading artifacts
    permissions:
      actions: read
      contents: read

    env:
      # See https://github.com/ast-grep/ast-grep/blob/0.50.0/crates/cli/src/custom_language.rs#L170-L173
      AST_GREP_TRUST_DIR: ${{ github.workspace }}/.ast-grep-trust

    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: just,ast-grep

      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: |
            justfile

      - run: just setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Let ast-grep trust custom languages
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$AST_GREP_TRUST_DIR"
          CONFIG="$(realpath sgconfig.yml)"
          jq --null-input --arg p "$CONFIG" '[$p]' > "$AST_GREP_TRUST_DIR/trusted-configs.json"

          # Note that this does not check if it works. It only helps for debugging.
          ast-grep scan

      - run: just check
      - run: just test

      - name: List example packages
        shell: bash
        run: |
          cat <<EOF > deps.typ
          #import "@preview/touying:0.6.1"
          #import "@preview/glossarium:0.5.8"
          EOF
      - uses: typst-community/setup-typst@v4
        with:
          cache-dependency-path: deps.typ

      - name: Scan default rules
        run: |
          just scan touying/0.6.1
          just scan glossarium/0.5.8
      - name: Scan hard-coded-str
        run: |
          just scan touying/0.6.1 --hint=hard-coded-str --filter=hard-coded-str
